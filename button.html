<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Onclick</title>
  </head>
  <body>
    <h1 id="header"></h1>
    <button onclick="greet(`Sharan`)">Greet</button>

    <script>
      function greet(name) {
        document.getElementById("header").innerHTML = "Hello" + name;
      }
    </script>
  </body>
</html>
